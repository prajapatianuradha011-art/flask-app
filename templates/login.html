<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
}

.container{
    width:380px;
    padding:40px;
    background:rgba(255,255,255,0.12);
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    text-align:center;
    color:white;
}

.container h2{
    margin-bottom:25px;
    font-size:32px;
}

.input-box{
    position:relative;
    margin:20px 0;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:16px;
}

.input-box input::placeholder{
    color:#eee;
}

.options{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin:15px 0;
}

.options a{
    color:white;
    text-decoration:none;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:white;
    color:#4f46e5;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#f1f5f9;
    transform:translateY(-2px);
}

.register{
    margin-top:20px;
    font-size:14px;
}

.register a{
    color:#fff;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    <form>
        <div class="input-box">
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password" required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember Me
            </label>
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Sign In</button>

        <div class="register">
            Don't have an account?
            <a href="#">Register</a>
        </div>
    </form>
</div>

</body>
</html>
