<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
    <div class="app">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="profile">
                    <div class="avatar">
                        {{ username[0]|upper }}
                    </div>
                    <div class="profile-name">{{ username }}</div>
                </div>

                <form action="/logout" method="POST">
                    <button class="icon-button" type="submit" title="Logout">↪</button>
                </form>
            </div>

            <div class="search-area">
                <div class="search-box">
                    <span>⌕</span>
                    <input id="searchInput" type="text" placeholder="Search conversations">
                </div>
            </div>

            <div class="chat-list">
                <button class="chat-item active" id="globalChatItem" type="button">
                    <div class="avatar">💬</div>
                    <div class="chat-details">
                        <div class="chat-title-row">
                            <span class="chat-title">Global Chat</span>
                            <span class="chat-time" id="lastTime"></span>
                        </div>
                        <div class="chat-preview" id="lastPreview">
                            Welcome! Start a conversation.
                        </div>
                    </div>
                </button>
            </div>
        </aside>

        <!-- MAIN CHAT -->
        <main class="conversation">

            <header class="conversation-header">
                <div class="header-info">
                    <div class="avatar">💬</div>
                    <div>
                        <div class="header-title">Global Chat</div>
                        <div class="header-status" id="status">
                            Connecting...
                        </div>
                    </div>
                </div>

                <button class="icon-button" type="button" title="Search messages"
                    onclick="document.getElementById('messageInput').focus()">
                    ⋮
                </button>
            </header>

            <section class="messages" id="messages" aria-live="polite">
                <div class="day-label">Your conversations</div>

                {% for message in messages %}
                <div class="message {% if message['username'] == username %}mine{% endif %}">
                    {% if message["username"] != username %}
                    <div class="message-author">
                        {{ message["username"] }}
                    </div>
                    {% endif %}

                    <div class="message-text">{{ message["msg"] }}</div>

                    <div class="message-meta">
                        <span>{{ message["created_at"] or "" }}</span>
                    </div>
                </div>
                {% endfor %}
            </section>

            <form class="composer" id="messageForm">
                <input id="messageInput" type="text" placeholder="Type a message" maxlength="2000" autocomplete="off"
                    required>

                <button class="send-button" id="sendButton" type="submit" title="Send message">
                    ➤
                </button>
            </form>

        </main>
    </div>

    <script>
        const socket = io();

        const statusElement = document.getElementById("status");
        const messagesElement = document.getElementById("messages");
        const messageForm = document.getElementById("messageForm");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const lastPreview = document.getElementById("lastPreview");
        const lastTime = document.getElementById("lastTime");
        const searchInput = document.getElementById("searchInput");
        const globalChatItem = document.getElementById("globalChatItem");

        const currentUsername = {{ username| tojson }};

        function scrollToBottom() {
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }

        function showTime() {
            return new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        socket.on("connect", () => {
            statusElement.textContent = "Online";
            sendButton.disabled = false;
        });

        socket.on("disconnect", () => {
            statusElement.textContent = "Reconnecting...";
            sendButton.disabled = true;
        });

        socket.on("connect_error", (error) => {
            console.error("Socket connection error:", error);
            statusElement.textContent = "Connection error";
            sendButton.disabled = true;
        });

        messageForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const msg = messageInput.value.trim();

            if (!msg || !socket.connected) {
                return;
            }

            socket.emit("chat_message", { msg: msg });
            messageInput.value = "";
            messageInput.focus();
        });

        socket.on("new_message", (data) => {
            if (!data ||
                typeof data.username !== "string" ||
                typeof data.msg !== "string") {
                return;
            }

            const bubble = document.createElement("div");
            bubble.className = "message";

            if (data.username === currentUsername) {
                bubble.classList.add("mine");
            } else {
                const author = document.createElement("div");
                author.className = "message-author";
                author.textContent = data.username;
                bubble.appendChild(author);
            }

            const text = document.createElement("div");
            text.className = "message-text";
            text.textContent = data.msg;

            const meta = document.createElement("div");
            meta.className = "message-meta";

            const time = document.createElement("span");
            time.textContent = showTime();

            meta.appendChild(time);
            bubble.appendChild(text);
            bubble.appendChild(meta);

            messagesElement.appendChild(bubble);

            lastPreview.textContent =
                (data.username === currentUsername ? "You: " : data.username + ": ")
                + data.msg;

            lastTime.textContent = showTime();

            scrollToBottom();
        });

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.toLowerCase();

            globalChatItem.style.display =
                "global chat".includes(query) ? "flex" : "none";
        });

        globalChatItem.addEventListener("click", () => {
            globalChatItem.classList.add("active");
            messageInput.focus();
        });

        scrollToBottom();
    </script>
</body>

</html>
